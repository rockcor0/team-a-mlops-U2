# Pipeline de CI/CD del servicio de diagnóstico clínico.
#
# Evento (1.): cada PR contra main
#   - Comenta en el PR que el pipeline comenzó.
#   - Corre las pruebas unitarias.
#   - Comenta en el PR que todo terminó con éxito.

name: CI/CD

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  comentar-inicio:
    name: Comentar inicio en el PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Comentar "CI/CD en acción"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "CI/CD en acción. Ejecutando tareas …",
            });

  pruebas:
    name: Pruebas unitarias
    needs: comentar-inicio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr pruebas unitarias
        run: pytest -v

  comentar-fin:
    name: Comentar fin en el PR
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Comentar "CI/CD terminado con éxito"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "CI/CD terminado con éxito.",
            });
